name: grocery_app
description: A new Flutter application.

publish_to: 'none'

version: 1.0.0+17

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  cupertino_icons: ^1.0.5
  flutter_svg: ^1.1.6
  flutter_staggered_grid_view: ^0.6.2
  direct_select: ^2.0.0
  carousel_slider: ^5.0.0
  get: ^4.6.5
  get_storage: ^2.1.1
  dio: ^5.4.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
#  redacted: ^1.0.13
#  skeletonizer: ^2.1.0+1
  shimmer: ^3.0.0
  html: ^0.15.4
  pull_to_refresh: ^2.0.0
  shared_preferences: ^2.0.15
  flutter_widget_from_html_core: ^0.17.4
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  video_player: ^2.14.0
  webview_flutter: ^4.14.1
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  intl_utils: ^2.6.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/categories_images/
    - assets/images/grocery_images/
    - assets/images/beverages_images/
    - assets/icons/
    - assets/icons/account_icons/
    - assets/fonts/
    - assets/slider/50off.jpg
    - assets/slider/new_coming.jpg
    - assets/slider/welcome.jpeg
    - assets/icons/home.svg
    - assets/images/profile.png
    - assets/images/shop.png

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/gilroy/Gilroy-Regular.ttf
        - asset: assets/fonts/gilroy/Gilroy-SemiBold.ttf
        - asset: assets/fonts/gilroy/Gilroy-Bold.otf
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/noto_sans_khmer/NotoSansKhmer-Variable.ttf
